<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>想いマグ - MindARテスト</title>
  
  <!-- A-Frame と MindAR のライブラリ -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #status-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-family: sans-serif;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="status-msg">マグネット本体を映してください</div>

  <!-- MindAR シーン設定 -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targets.mind の 0番目（登録したマグネット画像）に追従するターゲット -->
    <a-entity mindar-image-target="targetIndex: 0" id="magnet-target">
      
      <!-- テスト用：マグネットの上に青い半透明平面を重ねて位置確認 -->
      <a-plane color="#4B7B9E" opacity="0.4" position="0 0 0" height="0.55" width="1"></a-plane>
      
      <!-- くまの3Dモデル（マグネットの手前に立ち上がる） -->
      <a-entity 
        gltf-model="url(models/bear.glb)" 
        scale="0.25 0.25 0.25" 
        position="0 -0.1 0.1" 
        rotation="0 0 0">
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const statusMsg = document.getElementById('status-msg');
    const target = document.getElementById('magnet-target');

    // マグネットを認識した時
    target.addEventListener("targetFound", () => {
      statusMsg.innerText = "想いマグを認識しました！";
      statusMsg.style.background = "rgba(46, 204, 113, 0.85)";
    });

    // 見失った時
    target.addEventListener("targetLost", () => {
      statusMsg.innerText = "マグネット本体を映してください";
      statusMsg.style.background = "rgba(0, 0, 0, 0.75)";
    });
  </script>
</body>
</html>
