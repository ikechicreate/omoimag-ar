<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>想いマグ - OMOI-MAG AR</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/fcor/arjs-gestures/master/dist/gestures.js"></script>
  
  <script>
    AFRAME.registerComponent('canvas-text', {
      schema: {
        value: { type: 'string', default: 'いつもありがとう。' },
        color: { type: 'string', default: '#333333' }
      },
      init: function () {
        this.canvas = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 2; 
        this.canvas.width = 1024 * dpr;
        this.canvas.height = 256 * dpr;
        
        this.ctx = this.canvas.getContext('2d');
        this.ctx.scale(dpr, dpr);
        
        this.texture = new THREE.CanvasTexture(this.canvas);
        this.texture.minFilter = THREE.LinearFilter;
        this.texture.magFilter = THREE.LinearFilter;
        
        this.material = new THREE.MeshBasicMaterial({
          map: this.texture,
          transparent: true,
          side: THREE.DoubleSide
        });

        const applyMaterial = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) {
            mesh.material = this.material;
            this.drawText();
          }
        };

        if (this.el.hasLoaded) { applyMaterial(); } 
        else { this.el.addEventListener('loaded', applyMaterial); }
      },
      update: function () {
        if (this.ctx) { this.drawText(); }
      },
      drawText: function() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = this.data.color;
        this.ctx.font = "bold 100px 'Helvetica Neue', 'Hiragino Sans', 'Meiryo', sans-serif";
        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "middle";
        this.ctx.fillText(this.data.value, 1024 / 2, 256 / 2);
        this.texture.needsUpdate = true;
      }
    });

    AFRAME.registerComponent('follow-marker', {
      schema: { type: 'selector' },
      tick: function () {
        const marker = this.data;
        if (!marker) return;

        if (marker.object3D.visible) {
          this.el.object3D.position.copy(marker.object3D.position);
          this.el.object3D.rotation.copy(marker.object3D.rotation);
          
          if (!this.el.getAttribute('visible')) {
            this.el.setAttribute('visible', true);
          }
        }
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; }
    
    #start-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    #start-btn {
      padding: 15px 40px; font-size: 20px; font-weight: bold;
      background: #FF8C00; color: white; border: none; border-radius: 30px; cursor: pointer;
      margin-top: 20px; box-shadow: 0 4px 10px rgba(255, 140, 0, 0.4);
    }

    #edit-btn {
      position: absolute; top: 20px; right: 20px; z-index: 1000;
      width: 50px; height: 50px; border-radius: 50%;
      background: white; border: none; font-size: 24px; cursor: pointer; 
      display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      justify-content: center; align-items: center;
    }

    #settings-modal {
      position: absolute; bottom: -100%; left: 0; width: 100%; height: 80vh; overflow-y: auto;
      background: white; border-top-left-radius: 20px; border-top-right-radius: 20px;
      padding: 20px; box-sizing: border-box; z-index: 2000;
      transition: bottom 0.3s ease-in-out; box-shadow: 0 -4px 15px rgba(0,0,0,0.2);
    }
    #settings-modal.active { bottom: 0; }
    
    .setting-section { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #4B7B9E; }
    .setting-section.b-side { border-left-color: #E88C30; }
    .setting-section h4 { margin-top: 0; margin-bottom: 15px; color: #333; font-size: 18px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; font-size: 14px; }
    .form-group input, .form-group select {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box;
    }
    #save-btn {
      width: 100%; padding: 15px; font-size: 18px; font-weight: bold;
      background: #4B7B9E; color: white; border: none; border-radius: 10px; cursor: pointer;
      margin-bottom: 30px; 
    }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #888; line-height: 1; }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h2>想いマグ AR</h2>
    <p>カメラを許可し、マナーモードを解除してください</p>
    <button id="start-btn">スタート</button>
  </div>

  <button id="edit-btn">✏️</button>

  <div id="settings-modal">
    <span class="close-btn" id="close-btn">×</span>
    <h3 style="margin-top:0; color: #333; text-align: center;">コンテンツの編集</h3>
    
    <div class="setting-section">
      <h4>A面の設定</h4>
      <div class="form-group">
        <label>メッセージ (15文字まで)</label>
        <input type="text" id="input-msg-a" value="いつもありがとう。" maxlength="15">
      </div>
      <div class="form-group">
        <label>BGMを選択</label>
        <select id="select-music-a">
          <option value="music1" selected>曲1 (music1.mp3)</option>
          <option value="music2">曲2 (music2.mp3)</option>
          <option value="music3">曲3 (music3.mp3)</option>
        </select>
      </div>
    </div>

    <div class="setting-section b-side">
      <h4>B面の設定</h4>
      <div class="form-group">
        <label>メッセージ (15文字まで)</label>
        <input type="text" id="input-msg-b" value="これからもよろしく！" maxlength="15">
      </div>
      <div class="form-group">
        <label>BGMを選択</label>
        <select id="select-music-b">
          <option value="music1">曲1 (music1.mp3)</option>
          <option value="music2" selected>曲2 (music2.mp3)</option>
          <option value="music3">曲3 (music3.mp3)</option>
        </select>
      </div>
    </div>

    <button id="save-btn">保存してARを更新</button>
  </div>

  <a-scene 
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    gesture-detector
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">
    
    <a-assets>
      <audio id="music1" src="music1.mp3" preload="auto"></audio>
      <audio id="music2" src="music2.mp3" preload="auto"></audio>
      <audio id="music3" src="music3.mp3" preload="auto"></audio>
    </a-assets>

    <a-marker preset="hiro" id="marker-a" emitevents="true"></a-marker>
    <a-marker preset="kanji" id="marker-b" emitevents="true"></a-marker>

    <a-entity id="content-a" visible="false" follow-marker="#marker-a">
      <a-entity position="0 0.8 -0.5" rotation="-90 0 0" scale="2 0.5 1">
        <a-plane color="#FDF5E6" material="shader: flat;" position="0 0 0"></a-plane>
        <a-plane id="ar-text-a"
                 canvas-text="value: いつもありがとう。; color: #333333;" 
                 position="0 0 0.01" 
                 material="transparent: true; opacity: 1; alphaTest: 0.5;">
        </a-plane>
      </a-entity>
      <a-entity 
        gltf-model="url(boombox.glb)" 
        scale="1.5 1.5 1.5" 
        position="0 0 0"
        rotation="-90 0 0"
        class="clickable"
        gesture-handler="minScale: 0.5; maxScale: 5">
      </a-entity>
    </a-entity>

    <a-entity id="content-b" visible="false" follow-marker="#marker-b">
      <a-entity position="0 0.8 -0.5" rotation="-90 0 0" scale="2 0.5 1">
        <a-plane color="#FDF5E6" material="shader: flat;" position="0 0 0"></a-plane>
        <a-plane id="ar-text-b"
                 canvas-text="value: これからもよろしく！; color: #333333;" 
                 position="0 0 0.01" 
                 material="transparent: true; opacity: 1; alphaTest: 0.5;">
        </a-plane>
      </a-entity>
      <a-entity 
        gltf-model="url(boombox.glb)" 
        scale="1.5 1.5 1.5" 
        position="0 0 0"
        rotation="-90 0 0"
        class="clickable"
        gesture-handler="minScale: 0.5; maxScale: 5">
      </a-entity>
    </a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const editBtn = document.getElementById('edit-btn');
    const settingsModal = document.getElementById('settings-modal');
    const closeBtn = document.getElementById('close-btn');
    const saveBtn = document.getElementById('save-btn');
    
    const inputMsgA = document.getElementById('input-msg-a');
    const selectMusicA = document.getElementById('select-music-a');
    const inputMsgB = document.getElementById('input-msg-b');
    const selectMusicB = document.getElementById('select-music-b');
    const arTextA = document.getElementById('ar-text-a');
    const arTextB = document.getElementById('ar-text-b');

    const markerA = document.getElementById('marker-a');
    const markerB = document.getElementById('marker-b');
    const contentA = document.getElementById('content-a');
    const contentB = document.getElementById('content-b');
    
    const allMusics = [document.getElementById('music1'), document.getElementById('music2'), document.getElementById('music3')];

    let currentMusicIdA = 'music1';
    let currentMusicIdB = 'music2';
    let activeAudio = null; 

    startBtn.addEventListener('click', () => {
      startOverlay.style.display = 'none'; 
      editBtn.style.display = 'flex'; 

      allMusics.forEach(audio => {
        if(audio) {
          audio.muted = true; // ★追加：最初は完全に無音にする
          audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
            audio.muted = false; // ★追加：すぐにミュートを解除
          }).catch(e => console.log("音声ロック解除エラー:", e));
        }
      });
    });

    editBtn.addEventListener('click', () => settingsModal.classList.add('active'));
    closeBtn.addEventListener('click', () => settingsModal.classList.remove('active'));

    saveBtn.addEventListener('click', () => {
      arTextA.setAttribute('canvas-text', 'value', inputMsgA.value);
      arTextB.setAttribute('canvas-text', 'value', inputMsgB.value);
      
      currentMusicIdA = selectMusicA.value;
      currentMusicIdB = selectMusicB.value;
      
      settingsModal.classList.remove('active'); 
    });

    let lostTimeout = null;

    markerA.addEventListener('markerFound', () => {
      if(lostTimeout) clearTimeout(lostTimeout); 
      
      contentB.setAttribute('visible', false);

      const newAudio = document.getElementById(currentMusicIdA);
      if(activeAudio !== newAudio) {
        if(activeAudio) activeAudio.pause();
        activeAudio = newAudio;
        if(activeAudio) {
          activeAudio.currentTime = 0;
          activeAudio.play().catch(e=>console.log("再生エラー:", e));
        }
      }
    });

    markerB.addEventListener('markerFound', () => {
      if(lostTimeout) clearTimeout(lostTimeout); 

      contentA.setAttribute('visible', false);

      const newAudio = document.getElementById(currentMusicIdB);
      if(activeAudio !== newAudio) {
        if(activeAudio) activeAudio.pause();
        activeAudio = newAudio;
        if(activeAudio) {
          activeAudio.currentTime = 0;
          activeAudio.play().catch(e=>console.log("再生エラー:", e));
        }
      }
    });
  </script>
</body>
</html>
