<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>想いマグ - OMOI-MAG AR</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
  
  <script>
    // AR空間に文字を出すための部品（変更なし）
    AFRAME.registerComponent('canvas-text', {
      schema: {
        value: { type: 'string', default: 'メッセージが届いています' },
        color: { type: 'string', default: '#333333' }
      },
      init: function () {
        this.canvas = document.createElement('canvas');
        const dpr = window.devicePixelRatio || 2; 
        this.canvas.width = 1024 * dpr;
        this.canvas.height = 256 * dpr;
        this.ctx = this.canvas.getContext('2d');
        this.ctx.scale(dpr, dpr);
        this.texture = new THREE.CanvasTexture(this.canvas);
        this.texture.minFilter = THREE.LinearFilter;
        this.texture.magFilter = THREE.LinearFilter;
        this.material = new THREE.MeshBasicMaterial({
          map: this.texture,
          transparent: true,
          side: THREE.DoubleSide
        });
        const applyMaterial = () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh) { mesh.material = this.material; this.drawText(); }
        };
        if (this.el.hasLoaded) { applyMaterial(); } 
        else { this.el.addEventListener('loaded', applyMaterial); }
      },
      update: function () { if (this.ctx) { this.drawText(); } },
      drawText: function() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = this.data.color;
        this.ctx.font = "bold 100px 'Helvetica Neue', 'Hiragino Sans', 'Meiryo', sans-serif";
        this.ctx.textAlign = "center";
        this.ctx.textBaseline = "middle";
        this.ctx.fillText(this.data.value, 1024 / 2, 256 / 2);
        this.texture.needsUpdate = true;
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: transparent !important; }
    html { background-color: transparent !important; }
    
    #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; box-sizing: border-box; }
    #start-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background: #FF8C00; color: white; border: none; border-radius: 30px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 10px rgba(255, 140, 0, 0.4); }
    
    /* B面認識時に出る録音スタートボタン */
    #show-record-btn { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 15px 30px; font-size: 18px; font-weight: bold; background: #E88C30; color: white; border: none; border-radius: 30px; cursor: pointer; display: none; z-index: 1500; box-shadow: 0 4px 15px rgba(0,0,0,0.4); width: 80%; max-width: 300px; text-align: center; border: 2px solid white; }
    
    #settings-modal { position: absolute; bottom: -100%; left: 0; width: 100%; height: auto; padding-bottom: 40px; background: white; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; box-sizing: border-box; z-index: 2000; transition: bottom 0.3s ease-in-out; box-shadow: 0 -4px 15px rgba(0,0,0,0.2); }
    #settings-modal.active { bottom: 0; }
    .setting-section { background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 5px solid #E88C30; }
    .setting-section h4 { margin-top: 0; margin-bottom: 15px; color: #333; font-size: 18px; text-align: center; }
    
    .record-controls { display: flex; gap: 10px; margin-top: 10px; }
    .record-btn { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; background: #e74c3c; color: white; }
    .record-btn:disabled { background: #ccc; cursor: not-allowed; }
    .stop-btn { flex: 1; padding: 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; background: #34495e; color: white; }
    .stop-btn:disabled { background: #ccc; cursor: not-allowed; }
    .audio-preview { width: 100%; margin-top: 15px; display: none; }

    #save-btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; background: #4B7B9E; color: white; border: none; border-radius: 10px; cursor: pointer; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; color: #888; line-height: 1; }
    
    #status-display { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(75, 123, 158, 0.9); color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 16px; z-index: 1000; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

    /* 再生停止ボタン（A面用） */
    #universal-stop-btn { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); width: 80px; height: 80px; background-color: #34495e; color: white; border-radius: 50%; display: none; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 3px solid #fff; cursor: pointer; }
  </style>
</head>
<body>

  <div id="status-display">マーカーを認識しました！</div>
  <div id="universal-stop-btn">停止</div>
  <button id="show-record-btn">返信を録音する 🎤</button>

  <audio id="music1" src="music/music1.mp3" preload="auto" style="display: none;"></audio>
  <audio id="recorded-audio" preload="auto" style="display: none;"></audio>

  <div id="start-overlay">
    <h2>想いマグ - 通信機</h2>
    <p style="font-size: 16px; margin-bottom: 20px;">カメラを許可し、マナーモードを<br>解除してお楽しみください</p>
    <button id="start-btn">スタート</button>
  </div>

  <!-- 返信用録音モーダル（B面からのみ開く） -->
  <div id="settings-modal">
    <span class="close-btn" id="close-btn">×</span>
    <h3 style="margin-top:0; color: #333; text-align: center;">相手へ返信する</h3>
    
    <div class="setting-section">
      <h4>あなたの声を録音</h4>
      <div class="record-controls">
        <button id="record-btn" class="record-btn">録音開始 🔴</button>
        <button id="stop-btn" class="stop-btn" disabled>停止 ⬛</button>
      </div>
      <audio id="preview-audio" class="audio-preview" controls></audio>
    </div>
    <button id="save-btn">この声で返信する（保存）</button>
  </div>

  <a-scene 
    embedded
    renderer="alpha: true; colorManagement: true;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="-1 2 1"></a-light>

    <!-- A面（聞く面：Hiroマーカー） -->
    <a-marker preset="hiro" id="marker-a" emitevents="true">
      <a-box scale="0.01 0.01 0.01" material="transparent: true; opacity: 0;"></a-box>
    </a-marker>
    
    <!-- B面（話す面：Kanjiマーカー） -->
    <a-marker preset="kanji" id="marker-b" emitevents="true">
      <a-box scale="0.01 0.01 0.01" material="transparent: true; opacity: 0;"></a-box>
    </a-marker>

    <a-entity camera>
      <!-- ▼ A面用コンテンツ（再生） -->
      <a-entity id="ui-a" visible="false">
        <a-entity id="paper-a" scale="0 0 0" position="0 1.0 -5" rotation="0 0 0">
          <a-plane color="#FDF5E6" material="shader: flat; side: double;" position="0 0 0" scale="2 0.5 1"></a-plane>
          <a-plane id="ar-text-a" canvas-text="value: メッセージが届いています; color: #333333;" position="0 0 0.05" scale="2 0.5 1" material="transparent: true; opacity: 1; alphaTest: 0.5;"></a-plane>
        </a-entity>
        <a-entity id="model-a" gltf-model="url(models/bear.glb)" scale="0.4 0.4 0.4" position="0 -1.2 -5"></a-entity>
      </a-entity>

      <!-- ▼ B面用コンテンツ（録音案内） -->
      <a-entity id="ui-b" visible="false">
        <a-entity id="paper-b" scale="0 0 0" position="0 1.0 -5" rotation="0 0 0">
          <a-plane color="#FDF5E6" material="shader: flat; side: double;" position="0 0 0" scale="2 0.5 1"></a-plane>
          <a-plane canvas-text="value: 画面から返信を録音してね; color: #E88C30;" position="0 0 0.05" scale="2 0.5 1" material="transparent: true; opacity: 1; alphaTest: 0.5;"></a-plane>
        </a-entity>
        <a-entity id="model-b" gltf-model="url(models/bear.glb)" scale="0.4 0.4 0.4" position="0 -1.2 -5"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const DELAY_TIME_MS = 1500; 

    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const settingsModal = document.getElementById('settings-modal');
    const closeBtn = document.getElementById('close-btn');
    const saveBtn = document.getElementById('save-btn');
    const statusDisplay = document.getElementById('status-display');
    const universalStopBtn = document.getElementById('universal-stop-btn');
    const showRecordBtn = document.getElementById('show-record-btn');
    
    const uiA = document.getElementById('ui-a');
    const uiB = document.getElementById('ui-b');
    const paperA = document.getElementById('paper-a');
    const paperB = document.getElementById('paper-b');

    const recordBtn = document.getElementById('record-btn');
    const stopBtn = document.getElementById('stop-btn');
    const previewAudio = document.getElementById('preview-audio');
    const recordedAudio = document.getElementById('recorded-audio');
    const arTextA = document.getElementById('ar-text-a');

    let mediaRecorder;
    let audioChunks = [];
    let isAudioUnlocked = false;
    let activeBGM = null; 
    let activeVoice = null;
    let actionTimeout = null;
    let hasRecordedMessage = false; // 録音済みかどうかの判定

    // 録音機能の処理
    recordBtn.addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
          const audioUrl = URL.createObjectURL(audioBlob);
          previewAudio.src = audioUrl;
          previewAudio.style.display = 'block';
          recordedAudio.src = audioUrl; 
          audioChunks = []; 
          hasRecordedMessage = true;
        };
        
        mediaRecorder.start();
        recordBtn.disabled = true;
        stopBtn.disabled = false;
        recordBtn.innerText = '録音中...';
      } catch (err) {
        alert('マイクのアクセスが拒否されたか、エラーが発生しました。');
      }
    });

    stopBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop()); 
        recordBtn.disabled = false;
        stopBtn.disabled = true;
        recordBtn.innerText = 'もう一度録音する';
      }
    });

    // スタートボタン処理
    startBtn.addEventListener('click', () => {
      startOverlay.style.display = 'none'; 
      const videos = document.querySelectorAll('video');
      videos.forEach(video => video.play().catch(e => console.warn("Camera error:", e)));

      if (!isAudioUnlocked) {
        document.getElementById('music1').load();
        recordedAudio.load();
        isAudioUnlocked = true;
      }
    });

    // モーダルの開閉
    showRecordBtn.addEventListener('click', () => settingsModal.classList.add('active'));
    closeBtn.addEventListener('click', () => settingsModal.classList.remove('active'));

    // 保存ボタン（A面へメッセージを送った風にする）
    saveBtn.addEventListener('click', () => {
      settingsModal.classList.remove('active'); 
      showRecordBtn.style.display = 'none'; // 保存したら録音ボタンを隠す
      alert("返信を保存しました！\n（A面をかざすと新しいメッセージが聞けます）");
      
      // A面のテキストを書き換え
      if(hasRecordedMessage) {
        arTextA.setAttribute('canvas-text', 'value', "新しい返信が届きました");
      }
    });

    function playTargetMusic(bgmId, voiceId, uiElement, paperElement) {
      if (activeBGM) { activeBGM.pause(); activeBGM.currentTime = 0; }
      if (activeVoice) { activeVoice.pause(); activeVoice.currentTime = 0; }
      
      activeBGM = document.getElementById(bgmId);
      activeVoice = hasRecordedMessage ? document.getElementById(voiceId) : null;

      if (activeVoice) {
        activeVoice.play().catch(e => console.error("Voice play failed:", e)); 
      }
      if (activeBGM) {
        activeBGM.volume = activeVoice ? 0.3 : 1.0; 
        activeBGM.play().catch(e => console.error("BGM play failed:", e)); 
      }

      let longestAudio = activeVoice || activeBGM; 
      if (longestAudio) {
        longestAudio.onended = () => {
          paperElement.setAttribute('scale', '0 0 0');
          universalStopBtn.style.display = 'none'; 
        };
      }
    }

    function stopAllMediaAndHide() {
      if (actionTimeout) clearTimeout(actionTimeout);
      if (activeBGM) { activeBGM.pause(); activeBGM.currentTime = 0; }
      if (activeVoice) { activeVoice.pause(); activeVoice.currentTime = 0; }
      
      paperA.setAttribute('scale', '0 0 0');
      paperB.setAttribute('scale', '0 0 0');
      universalStopBtn.style.display = 'none'; 
    }

    universalStopBtn.addEventListener('click', stopAllMediaAndHide);

    // ==========================================
    // A面マーカーを見つけた時の動作（聞く）
    // ==========================================
    const markerA = document.getElementById('marker-a');
    markerA.addEventListener('markerFound', () => {
      if(actionTimeout) clearTimeout(actionTimeout); 
      statusDisplay.innerText = "A面：メッセージを再生します";
      statusDisplay.style.display = "block";
      showRecordBtn.style.display = "none"; // A面では録音ボタンを隠す
      universalStopBtn.style.display = "flex"; 
      
      uiA.setAttribute('visible', true);
      uiB.setAttribute('visible', false);
      paperA.setAttribute('scale', '0 0 0');
      
      document.getElementById('model-a').setAttribute('animation-mixer', 'clip: *; loop: once; clampWhenFinished: true;');
      
      actionTimeout = setTimeout(() => {
        paperA.setAttribute('scale', '1 1 1'); 
        playTargetMusic('music1', 'recorded-audio', uiA, paperA); 
      }, DELAY_TIME_MS);
    });

    markerA.addEventListener('markerLost', () => {
      statusDisplay.style.display = "none";
    });

    // ==========================================
    // B面マーカーを見つけた時の動作（話す・録音する）
    // ==========================================
    const markerB = document.getElementById('marker-b');
    markerB.addEventListener('markerFound', () => {
      if(actionTimeout) clearTimeout(actionTimeout);
      stopAllMediaAndHide(); // B面にしたら再生を止める
      
      statusDisplay.innerText = "B面：返信モード";
      statusDisplay.style.display = "block";
      showRecordBtn.style.display = "block"; // 録音ボタンを表示
      
      uiB.setAttribute('visible', true);
      uiA.setAttribute('visible', false);
      paperB.setAttribute('scale', '0 0 0');
      
      document.getElementById('model-b').setAttribute('animation-mixer', 'clip: *; loop: once; clampWhenFinished: true;');
      
      actionTimeout = setTimeout(() => {
        paperB.setAttribute('scale', '1 1 1');
      }, DELAY_TIME_MS);
    });

    markerB.addEventListener('markerLost', () => {
      statusDisplay.style.display = "none";
    });
  </script>
</body>
</html>
